<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Glove Care - Live Dashboard</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --accent: #38bdf8;
      --green: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 { margin: 0; font-size: 20px; }
    .brand p { margin: 0; font-size: 13px; color: var(--text-muted); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #1e293b;
    }
    .hero-card {
      text-align: center;
      border: 1px solid #0284c7;
    }
    .hero-icon { font-size: 45px; margin-bottom: 8px; }
    .hero-title { font-size: 22px; font-weight: bold; color: var(--accent); }
    .hero-desc { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
    
    .bar-container { margin: 15px 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .progress { background: #0f172a; height: 10px; border-radius: 5px; overflow: hidden; }
    .fill { height: 100%; background: var(--green); width: 0%; transition: width 0.3s; }

    input {
      width: calc(100% - 24px);
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      margin-top: 10px;
      outline: none;
    }
    ul { list-style: none; padding: 0; margin: 10px 0 0; max-height: 180px; overflow-y: auto; }
    li {
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      border-left: 3px solid var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div style="font-size: 30px;">🧤</div>
      <div>
        <h1>Smart Glove Care</h1>
        <p>Patient assistive alert system</p>
      </div>
    </div>
    <div class="badge">
      <span class="dot" id="connDot"></span>
      <span id="connText">Disconnected</span>
    </div>
  </div>

  <div class="grid">
    <!-- Live Status Section -->
    <div class="card hero-card">
      <div class="hero-icon" id="heroIcon">😊</div>
      <div class="hero-title" id="statusTitle">All good</div>
      <div class="hero-desc" id="statusDesc">All is well. Patient is resting comfortably.</div>
    </div>

    <!-- Live Sensors Bars -->
    <div class="card">
      <h3 style="margin-top:0;">Live Flex Sensors</h3>
      <div class="bar-container">
        <div class="bar-label"><span>Index Finger</span><span id="f1Val">0%</span></div>
        <div class="progress"><div class="fill" id="f1Bar"></div></div>
      </div>
      <div class="bar-container">
        <div class="bar-label"><span>Middle Finger</span><span id="f2Val">0%</span></div>
        <div class="progress"><div class="fill" id="f2Bar"></div></div>
      </div>
      <div class="bar-container">
        <div class="bar-label"><span>Thumb / Ring</span><span id="f3Val">0%</span></div>
        <div class="progress"><div class="fill" id="f3Bar"></div></div>
      </div>
    </div>

    <!-- Connection Config -->
    <div class="card">
      <h3 style="margin-top:0;">Connection</h3>
      <label style="font-size: 13px; color: var(--text-muted);">ESP32 IP Address:</label>
    <input type="text" id="ipInput" value="192.168.9.73" placeholder="उदा. 192.168.9.73">
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">
        मोबाईल/लॅपटॉप आणि ESP32 एकाच Wi-Fi वर असणे आवश्यक आहे.
      </p>
    </div>

    <!-- Alert History -->
    <div class="card">
      <h3 style="margin-top:0;">Alert History</h3>
      <ul id="historyList">
        <li><span>System Started</span><span style="color:var(--text-muted);">Just now</span></li>
      </ul>
    </div>
  </div>

  <script>
    let lastAlert = "";

    async function fetchData() {
      const ip = document.getElementById("ipInput").value.trim();
      const dot = document.getElementById("connDot");
      const text = document.getElementById("connText");

      if (!ip) return;

      try {
        const res = await fetch(`http://${ip}/data`, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          
          dot.style.background = "#22c55e";
          text.innerText = "Connected";

          document.getElementById("heroIcon").innerText = data.icon;
          document.getElementById("statusTitle").innerText = data.status;
          document.getElementById("statusDesc").innerText = data.detail;

          // Bars update (0 to 100%)
          document.getElementById("f1Bar").style.width = data.f1 + "%";
          document.getElementById("f1Val").innerText = data.f1 + "%";
          document.getElementById("f2Bar").style.width = data.f2 + "%";
          document.getElementById("f2Val").innerText = data.f2 + "%";
          document.getElementById("f3Bar").style.width = data.f3 + "%";
          document.getElementById("f3Val").innerText = data.f3 + "%";

          // Alert history push
          if (data.status !== "All good" && data.status !== lastAlert) {
            lastAlert = data.status;
            const li = document.createElement("li");
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            li.innerHTML = `<span>${data.icon} ${data.status}</span><span style="color:#94a3b8;">${time}</span>`;
            document.getElementById("historyList").prepend(li);
          }
        }
      } catch (e) {
        dot.style.background = "#ef4444";
        text.innerText = "Disconnected";
      }
    }

    setInterval(fetchData, 1500);
  </script>
</body>
</html>
