<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Glove - 3 Finger Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      font-weight: 700;
    }
    header p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .main-grid {
      width: 100%;
      max-width: 950px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .card {
      background: #161f30;
      border: 1px solid #233249;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #233249;
      padding-bottom: 10px;
    }
    /* 3 Fingers Display */
    .finger-item {
      margin-bottom: 18px;
    }
    .finger-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .progress-track {
      background: #0b0f19;
      border-radius: 10px;
      height: 14px;
      overflow: hidden;
      border: 1px solid #2d3f5d;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #6366f1);
      width: 60%;
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    /* Output Status Box */
    .output-box {
      background: #0b0f19;
      border: 1px solid #2d3f5d;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-top: 20px;
    }
    .output-box .title {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .output-box .status {
      font-size: 1.15rem;
      color: #22c55e;
      font-weight: 600;
      margin-top: 4px;
    }
    /* Video Box */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 ratio */
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid #233249;
    }
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .sim-btn {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sim-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧤 Smart Gesture Glove</h1>
    <p>3 Flex Sensors Live Monitor & Video Demo</p>
  </header>

  <div class="main-grid">
    <!-- Live Sensors Panel -->
    <div class="card">
      <h2>📊 Live Sensor Data (3 Fingers)</h2>

      <!-- Finger 1 -->
      <div class="finger-item">
        <div class="finger-label">
          <span>Finger 1 (Thumb)</span>
          <span id="v1">55%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="b1" style="width: 55%;"></div>
        </div>
      </div>

      <!-- Finger 2 -->
      <div class="finger-item">
        <div class="finger-label">
          <span>Finger 2 (Index)</span>
          <span id="v2">80%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="b2" style="width: 80%;"></div>
        </div>
      </div>

      <!-- Finger 3 -->
      <div class="finger-item">
        <div class="finger-label">
          <span>Finger 3 (Middle)</span>
          <span id="v3">40%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="b3" style="width: 40%;"></div>
        </div>
      </div>

      <div class="output-box">
        <div class="title">Recognized Gesture Message</div>
        <div class="status" id="gestureMsg">Need Water (पाणी हवे आहे)</div>
      </div>

      <button class="sim-btn" onclick="randomData()">Simulate Random Readings</button>
    </div>

    <!-- Video Demo Panel -->
    <div class="card">
      <h2>🎥 Working Demo Video</h2>
      <div class="video-container">
        <!-- Working MP4 Demo Stream -->
        <video controls autoplay muted loop playsinline>
          <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
          व्हिडिओ लोड होऊ शकला नाही.
        </video>
      </div>
      <p style="margin-top: 12px; font-size: 0.8rem; color: #94a3b8; text-align: center;">
        प्रोजेक्टचा डेमो व्हिडिओ येथे आपोआप चालू होईल.
      </p>
    </div>
  </div>

  <script>
    function updateSensors(f1, f2, f3) {
      document.getElementById('b1').style.width = f1 + '%';
      document.getElementById('v1').innerText = f1 + '%';

      document.getElementById('b2').style.width = f2 + '%';
      document.getElementById('v2').innerText = f2 + '%';

      document.getElementById('b3').style.width = f3 + '%';
      document.getElementById('v3').innerText = f3 + '%';

      const msg = document.getElementById('gestureMsg');
      if (f1 > 70 && f2 > 70) {
        msg.innerText = "🚨 Emergency Alert!";
        msg.style.color = "#ef4444";
      } else if (f2 > 60) {
        msg.innerText = "💧 Need Water (पाणी हवे आहे)";
        msg.style.color = "#38bdf8";
      } else if (f3 > 60) {
        msg.innerText = "💊 Need Medicine (औषध हवे आहे)";
        msg.style.color = "#fbbf24";
      } else {
        msg.innerText = "✅ Normal / Comfortable";
        msg.style.color = "#22c55e";
      }
    }

    function randomData() {
      const val1 = Math.floor(Math.random() * 95) + 5;
      const val2 = Math.floor(Math.random() * 95) + 5;
      const val3 = Math.floor(Math.random() * 95) + 5;
      updateSensors(val1, val2, val3);
    }
  </script>
</body>
</html>
